[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "deltaleague"
version = "0.3.0"
description = "CLI for Delta League model-weight competitions, submissions, and local evaluation"
readme = "README.md"
authors = [{name = "Delta League"}]
keywords = ["llm", "benchmark", "model-weights", "leaderboard"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Operating System :: MacOS", "Operating System :: POSIX :: Linux"]
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "typer>=0.16,<1", "safetensors>=0.5,<1", "torch>=2.6"]
[project.urls]
Homepage = "https://deltaleague.ai"
Repository = "https://github.com/ilblackdragon/deltaleague"
Documentation = "https://github.com/ilblackdragon/deltaleague/blob/main/README.md"
Issues = "https://github.com/ilblackdragon/deltaleague/issues"

[project.optional-dependencies]
local = ["transformers==5.22.1", "math-verify==0.9.0", "lm-eval[ifeval]==0.4.13"]
ifeval = ["lm-eval[ifeval]==0.4.13"]
terminal-eval = ["harbor==0.25.0", "transformers==5.22.1"]
public-eval = [
  "torch==2.10.0", "lm-eval[ifeval,api,math]==0.4.13", "bfcl-eval==2025.12.17",
  "numpy==1.26.4", "pyarrow==21.0.0", "transformers==5.22.1", "soundfile==0.14.0",
  "qwen-agent==0.0.34", "antlr4-python3-runtime==4.11", "wasmtime==50.0.1"
]

[project.scripts]
delta = "delta_cli.main:app"
[tool.setuptools.packages.find]
include = ["delta_cli*"]

[tool.setuptools.package-data]
"delta_cli.public_eval" = ["data/*.json", "data/*.whl", "requirements.txt", "terminal-requirements.txt"]
